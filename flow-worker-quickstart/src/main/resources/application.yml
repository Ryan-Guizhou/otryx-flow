spring:
  application:
    name: flow-worker-demo
  main:
    web-application-type: none
management:
  tracing:
    sampling:
      probability: ${FLOW_TRACE_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}
    metrics:
      export:
        enabled: ${FLOW_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://127.0.0.1:4318/v1/metrics}
        step: ${FLOW_OTLP_METRICS_STEP:15s}
flow:
  worker:
    id: ${FLOW_WORKER_ID:flow-worker-demo}
otryx:
  rpc:
    security-profile: TRUSTED_DEVELOPMENT # Only isolated local demo / CI; never production.
    registry:
      type: nacos
      endpoints: ${OTRYX_REGISTRY_ENDPOINTS:127.0.0.1:8848}
      namespace: public
      nacos:
        group: OTRYX_RPC
        cluster: DEFAULT
    client:
      timeout: 3s
    server:
      host: 0.0.0.0
      port: 0
      advertised-host: ${FLOW_RPC_ADVERTISED_HOST:127.0.0.1}
      advertised-port: 0
