# M2 developer-only: Nacos 3.2.4, Scheduler/Dispatcher dual replicas and Engine. Never a public deployment.
name: otryx-flow
x-backend-build: &backend-build
  context: .
  dockerfile: deploy/Dockerfile.backend
  args:
    OTRYX_RPC_SHA: ${OTRYX_RPC_SHA:?Set the RPC commit SHA in .env}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${FLOW_DB_ROOT_PASSWORD:?Set a root password in .env}
      MYSQL_DATABASE: flow_identity
      MYSQL_USER: flow_app
      MYSQL_PASSWORD: ${FLOW_DB_PASSWORD:?Set an app password in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 4s
      retries: 25
    networks: [internal]

  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false" # isolated developer-only; no published ports
      NACOS_AUTH_TOKEN: ${FLOW_NACOS_AUTH_TOKEN:?Set development Nacos signing token in .env}
      NACOS_AUTH_IDENTITY_KEY: flow-local
      NACOS_AUTH_IDENTITY_VALUE: ${FLOW_NACOS_IDENTITY_VALUE:?Set development Nacos identity in .env}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes: [nacos_data:/home/nacos/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 36
    networks: [internal]

  # Mandatory one-shot Nacos V2 mapping bootstrap; runs before any RPC JVM.
  nacos-bootstrap:
    image: otryx-flow-backend:m1
    entrypoint: ["java", "-Dloader.main=com.peachsoft.otryx.registry.nacos.NacosV2MetadataBootstrap", "-cp", "/apps/flow-api.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    command: ["nacos:8848", "public", "OTRYX_RPC", "TRUSTED_DEVELOPMENT"]
    depends_on:
      nacos: {condition: service_healthy}
    restart: "no"
    networks: [internal]

  flow-metadata:
    image: otryx-flow-backend:m1
    command: ["/apps/flow-metadata.jar"]
    environment:
      FLOW_DB_JDBC_URL: jdbc:mysql://mysql:3306/flow_metadata?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FLOW_DB_USER: flow_app
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:?Set an app password in .env}
      OTRYX_REGISTRY_ENDPOINTS: nacos:8848
      FLOW_RPC_ADVERTISED_HOST: flow-metadata
    depends_on:
      mysql: {condition: service_healthy}
      nacos-bootstrap: {condition: service_completed_successfully}
    networks: [internal]


  flow-scheduler:
    image: otryx-flow-backend:m1
    command: ["/apps/flow-scheduler.jar"]
    environment:
      FLOW_DB_JDBC_URL: jdbc:mysql://mysql:3306/flow_scheduler?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FLOW_DB_USER: flow_app
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:?Set an app password in .env}
      OTRYX_REGISTRY_ENDPOINTS: nacos:8848
      FLOW_RPC_ADVERTISED_HOST: flow-scheduler
      FLOW_SCHEDULER_POLL_MS: 1000
    depends_on:
      mysql: {condition: service_healthy}
      nacos-bootstrap: {condition: service_completed_successfully}
      flow-metadata: {condition: service_started}
    networks: [internal]

  flow-scheduler-replica:
    image: otryx-flow-backend:m1
    command: ["/apps/flow-scheduler.jar"]
    environment:
      FLOW_DB_JDBC_URL: jdbc:mysql://mysql:3306/flow_scheduler?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FLOW_DB_USER: flow_app
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:?Set an app password in .env}
      OTRYX_REGISTRY_ENDPOINTS: nacos:8848
      FLOW_RPC_ADVERTISED_HOST: flow-scheduler-replica
      FLOW_SCHEDULER_POLL_MS: 1000
    depends_on:
      mysql: {condition: service_healthy}
      nacos-bootstrap: {condition: service_completed_successfully}
      flow-metadata: {condition: service_started}
    networks: [internal]


  flow-engine:
    image: otryx-flow-backend:m1
    restart: on-failure:5
    command: ["/apps/flow-engine.jar"]
    environment:
      FLOW_DB_JDBC_URL: jdbc:mysql://mysql:3306/flow_engine?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FLOW_DB_USER: flow_app
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:?Set an app password in .env}
      OTRYX_REGISTRY_ENDPOINTS: nacos:8848
      FLOW_RPC_ADVERTISED_HOST: flow-engine
    depends_on:
      mysql: {condition: service_healthy}
      nacos-bootstrap: {condition: service_completed_successfully}
    networks: [internal]


  flow-dispatcher:
    image: otryx-flow-backend:m1
    command: ["/apps/flow-dispatcher.jar"]
    environment:
      FLOW_DB_JDBC_URL: jdbc:mysql://mysql:3306/flow_dispatcher?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FLOW_DB_USER: flow_app
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:?Set an app password in .env}
      OTRYX_REGISTRY_ENDPOINTS: nacos:8848
      FLOW_RPC_ADVERTISED_HOST: flow-dispatcher
      SPRING_PROFILES_ACTIVE: ${FLOW_DISPATCH_E2E_PROFILE:-default}
    depends_on:
      mysql: {condition: service_healthy}
      nacos-bootstrap: {condition: service_completed_successfully}
    networks: [internal]

  flow-dispatcher-replica:
    image: otryx-flow-backend:m1
    command: ["/apps/flow-dispatcher.jar"]
    environment:
      FLOW_DB_JDBC_URL: jdbc:mysql://mysql:3306/flow_dispatcher?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FLOW_DB_USER: flow_app
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:?Set an app password in .env}
      OTRYX_REGISTRY_ENDPOINTS: nacos:8848
      FLOW_RPC_ADVERTISED_HOST: flow-dispatcher-replica
    depends_on:
      mysql: {condition: service_healthy}
      nacos-bootstrap: {condition: service_completed_successfully}
    networks: [internal]

  flow-api:
    build: *backend-build
    restart: on-failure:5
    image: otryx-flow-backend:m1
    command: ["/apps/flow-api.jar"]
    environment:
      FLOW_DB_JDBC_URL: jdbc:mysql://mysql:3306/flow_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FLOW_DB_USER: flow_app
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:?Set an app password in .env}
      FLOW_ADMIN_USERNAME: ${FLOW_ADMIN_USERNAME:?Set an admin username in .env}
      FLOW_ADMIN_PASSWORD: ${FLOW_ADMIN_PASSWORD:?Set an admin password in .env}
      OTRYX_REGISTRY_ENDPOINTS: nacos:8848
    depends_on:
      mysql: {condition: service_healthy}
      nacos-bootstrap: {condition: service_completed_successfully}
      flow-metadata: {condition: service_started}
      flow-scheduler: {condition: service_started}
      flow-scheduler-replica: {condition: service_started}
      flow-engine: {condition: service_started}
      flow-dispatcher: {condition: service_started}
      flow-dispatcher-replica: {condition: service_started}
    networks: [internal]

  # Explicit, CI-only demo profile; keeps Worker out of the earlier lease fencing test.
  flow-worker-demo:
    profiles: [worker-demo]
    image: otryx-flow-backend:m1
    command: ["/apps/flow-worker-quickstart.jar"]
    environment:
      OTRYX_REGISTRY_ENDPOINTS: nacos:8848
      FLOW_WORKER_ID: flow-worker-demo
      FLOW_E2E_DELAY_HANDLER: ${FLOW_E2E_DELAY_HANDLER:-false}
      FLOW_RPC_ADVERTISED_HOST: flow-worker-demo
    depends_on:
      nacos-bootstrap: {condition: service_completed_successfully}
      flow-dispatcher: {condition: service_started}
      flow-dispatcher-replica: {condition: service_started}
    networks: [internal]

  flow-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: otryx-flow-web:m1
    ports:
      - 127.0.0.1:8088:80
    depends_on: [flow-api]
    networks: [internal, ingress]

networks:
  ingress: {} # only Nginx joins this network; enable host loopback publishing
  internal:
    internal: true # block runtime egress; Docker image pulls happen outside the container network
volumes:
  mysql_data:
  nacos_data:
