spring:
  application:
    name: flow-scheduler
  datasource:
    url: ${FLOW_DB_JDBC_URL:jdbc:mysql://localhost:3306/flow_scheduler?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${FLOW_DB_USER:flow_app}
    password: ${FLOW_DB_PASSWORD:}
  flyway:
    enabled: true
server:
  port: ${FLOW_HTTP_PORT:8082}
management:
  server:
    port: ${FLOW_MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${FLOW_TRACE_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}
flow:
  scheduler:
    poll-ms: ${FLOW_SCHEDULER_POLL_MS:1000}
otryx:
  rpc:
    security-profile: TRUSTED_DEVELOPMENT # Isolated development only; never expose to the Internet.
    registry:
      type: nacos
      endpoints: ${OTRYX_REGISTRY_ENDPOINTS:127.0.0.1:8848}
      namespace: public
      nacos:
        group: OTRYX_RPC
        cluster: DEFAULT
    server:
      host: 0.0.0.0
      port: 19091
      advertised-host: ${FLOW_RPC_ADVERTISED_HOST:127.0.0.1}
      advertised-port: 19091
    client:
      timeout: 3s
