spring:
  application:
    name: flow-engine
  datasource:
    url: ${FLOW_DB_JDBC_URL:jdbc:mysql://localhost:3306/flow_engine?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${FLOW_DB_USER:flow_app}
    password: ${FLOW_DB_PASSWORD:}
  flyway:
    enabled: true
server:
  port: ${FLOW_HTTP_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
otryx:
  rpc:
    security-profile: TRUSTED_DEVELOPMENT # Isolated development only; use NETWORK_MTLS in production.
    registry:
      type: etcd
      endpoints: ${OTRYX_REGISTRY_ENDPOINTS:http://127.0.0.1:2379}
      namespace: flow-dev
    server:
      host: 0.0.0.0
      port: 19092
      advertised-host: ${FLOW_RPC_ADVERTISED_HOST:127.0.0.1}
      advertised-port: 19092
    client:
      timeout: 3s
