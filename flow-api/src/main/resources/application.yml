spring:
  application:
    name: flow-api
  datasource:
    url: ${FLOW_DB_JDBC_URL:jdbc:mysql://localhost:3306/flow_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${FLOW_DB_USER:flow_app}
    password: ${FLOW_DB_PASSWORD:}
  flyway:
    enabled: true
server:
  port: ${FLOW_HTTP_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${FLOW_SECURE_COOKIES:false}
flow:
  bootstrap:
    admin-username: ${FLOW_ADMIN_USERNAME:admin}
    admin-password: ${FLOW_ADMIN_PASSWORD:}
management:
  server:
    port: ${FLOW_MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${FLOW_TRACE_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}
otryx:
  rpc:
    security-profile: TRUSTED_DEVELOPMENT # Developer-only isolated Compose network.
    registry:
      type: nacos
      endpoints: ${OTRYX_REGISTRY_ENDPOINTS:127.0.0.1:8848}
      namespace: public
      nacos:
        group: OTRYX_RPC
        cluster: DEFAULT
    server:
      enabled: false
    client:
      timeout: 3s
