otryx:
  rpc:
    security-profile: TRUSTED_DEVELOPMENT # Developer-only isolated Compose network.
    registry:
      type: nacos
      endpoints: ${OTRYX_REGISTRY_ENDPOINTS:127.0.0.1:8848}
      namespace: public
      nacos:
        group: OTRYX_RPC
        cluster: DEFAULT
    server:
      enabled: false
    client:
      timeout: 3s
