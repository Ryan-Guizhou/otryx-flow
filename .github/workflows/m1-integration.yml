name: Flow full Compose integration
on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review, synchronize]
    paths:
      - "pom.xml"
      - "flow-api/**"
      - "flow-contracts/**"
      - "flow-metadata/**"
      - "flow-scheduler-core/**"
      - "flow-scheduler/**"
      - "flow-engine/**"
      - "flow-dispatcher/**"
      - "flow-worker-sdk/**"
      - "flow-worker-quickstart/**"
      - "flow-web/**"
      - "deploy/**"
      - "compose.yaml"
      - "compose.observability.yaml"
      - ".env.example"
      - "scripts/start_dev_compose.sh"
      - "scripts/test_m1_e2e.sh"
      - "scripts/test_m2_*_e2e.sh"
      - "scripts/test_m3_*_e2e.sh"
      - "scripts/check_observability_evidence.py"
      - "scripts/test_check_observability_evidence.py"
      - "scripts/check_rpc_metric_evidence.py"
      - "scripts/test_check_rpc_metric_evidence.py"
      - "scripts/test_rpc_metric_semantics.sh"
      - ".github/workflows/m1-integration.yml"
permissions:
  contents: read
concurrency:
  group: m1-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-integration:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: compose.yaml:compose.observability.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Test strict OTRYX RPC trace evidence validator
        run: python3 scripts/test_check_observability_evidence.py
      - name: Create temporary local-only test credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<EOF_ENV
          FLOW_DB_ROOT_PASSWORD=$(openssl rand -hex 24)
          FLOW_DB_PASSWORD=$(openssl rand -hex 24)
          FLOW_ADMIN_USERNAME=admin
          FLOW_ADMIN_PASSWORD=$(openssl rand -hex 24)
          OTRYX_RPC_SHA=0addd7df17c5ba4a0b77e2d30e4c7c75d7ac31f2
          FLOW_DISPATCH_E2E_PROFILE=e2e
          FLOW_NACOS_AUTH_TOKEN=$(openssl rand -base64 48)
          FLOW_NACOS_IDENTITY_VALUE=$(openssl rand -hex 24)
          FLOW_GRAFANA_ADMIN_USER=admin
          FLOW_GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)
          FLOW_OTLP_METRICS_STEP=5s
          FLOW_E2E_DELAY_HANDLER=true
          EOF_ENV
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build pinned backends and Vue image (8m max)
        run: timeout 8m docker compose build
      - name: Bootstrap Nacos V2 mappings and start RPC applications sequentially
        run: bash scripts/start_dev_compose.sh
      - name: Start observability stack and validate internal telemetry
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d otel-collector prometheus grafana
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose exec -T prometheus promtool check rules /etc/prometheus/flow-alerts.yml
          docker compose run --rm --no-deps otel-collector validate --config=/etc/otelcol-contrib/config.yaml
      - name: Run real RPC business path, restart recovery, and optional M2 jobs
        shell: bash
        env:
          FLOW_E2E_M2_JOBS: ${{ hashFiles('scripts/test_m2_job_e2e.sh') != '' && '1' || '0' }}
          FLOW_E2E_M2_SCHEDULES: ${{ hashFiles('scripts/test_m2_scheduler_e2e.sh') != '' && '1' || '0' }}
          FLOW_E2E_M2_ENGINE: ${{ hashFiles('scripts/test_m2_engine_e2e.sh') != '' && '1' || '0' }}
          FLOW_E2E_M2_DISPATCHER: ${{ hashFiles('scripts/test_m2_dispatcher_e2e.sh') != '' && '1' || '0' }}
          FLOW_E2E_M2_WORKER: ${{ hashFiles('scripts/test_m2_worker_e2e.sh') != '' && '1' || '0' }}
          FLOW_E2E_M2_FINAL: ${{ hashFiles('scripts/test_m2_final_e2e.sh') != '' && '1' || '0' }}
          FLOW_E2E_M3_WORKFLOWS: ${{ hashFiles('scripts/test_m3_workflow_e2e.sh') != '' && '1' || '0' }}
          FLOW_E2E_M3_DAG: ${{ hashFiles('scripts/test_m3_dag_e2e.sh') != '' && '1' || '0' }}
          FLOW_E2E_M3_CONTROL: ${{ hashFiles('scripts/test_m3_control_e2e.sh') != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          FLOW_E2E_RESTART_METADATA=1 bash scripts/test_m1_e2e.sh
      - name: Verify Prometheus scrapes Flow and Worker metrics
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile worker-demo up -d flow-worker-demo
          sleep 25
          query_metric() {
            local expression="$1"
            echo "Checking Prometheus metric: ${expression}"
            docker compose --profile observability-test run --rm --no-deps --entrypoint sh observability-probe -ec \
              'curl --fail --silent --show-error --get --data-urlencode "query=$1" http://prometheus:9090/api/v1/query' sh "${expression}" \
              | grep -q '"value":'
          }
          query_metric 'up{job="flow-api"}'
          query_metric 'flow_schedule_enabled'
          query_metric 'flow_dag_run_active'
          query_metric 'flow_dispatch_queue_ready'
          query_metric 'flow_worker_available_slots'
          query_metric 'flow_database_metrics_refresh_state'
          query_metric 'flow_http_responses_total{security_event="authentication_failure"}'
          query_metric 'flow_http_responses_total{security_event="authorization_denied"}'
      - name: Verify cross-JVM trace correlation
        shell: bash
        run: |
          set -euo pipefail
          docker compose logs --no-color --tail=3000 otel-collector > /tmp/otel-collector.log
          python3 scripts/check_observability_evidence.py /tmp/otel-collector.log
      - name: Verify live OTRYX RPC logical calls, attempts, and labels
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          bash scripts/test_rpc_metric_semantics.sh
      - name: Collect bounded failure diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=180 flow-api flow-metadata flow-scheduler flow-scheduler-replica flow-engine flow-dispatcher flow-dispatcher-replica flow-worker-demo nacos nacos-bootstrap mysql flow-web prometheus otel-collector || true
      - name: Remove ephemeral containers and databases
        if: always()
        run: docker compose down --volumes --remove-orphans || true
