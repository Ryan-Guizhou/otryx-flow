name: FLOW-032 real Job lifecycle acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/flow032-integration.yml'
      - 'compose.yaml'
      - 'deploy/**'
      - 'flow-api/**'
      - 'flow-contracts/**'
      - 'flow-dispatcher/**'
      - 'flow-engine/**'
      - 'flow-metadata/**'
      - 'flow-scheduler/**'
      - 'flow-worker-sdk/**'
      - 'flow-worker-quickstart/**'
      - 'flow-web/**'
      - 'scripts/start_dev_compose.sh'
      - 'scripts/test_m1_e2e.sh'
      - 'scripts/test_m2_job_e2e.sh'
      - 'scripts/test_m2_job_control_e2e.sh'
      - 'scripts/test_m2_scheduler_e2e.sh'
permissions:
  contents: read
concurrency:
  group: flow032-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compose-job-lifecycle:
    if: startsWith(github.head_ref, 'fix/flow-032-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: compose.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Compose credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<EOF_ENV
          FLOW_DB_ROOT_PASSWORD=$(openssl rand -hex 24)
          FLOW_DB_PASSWORD=$(openssl rand -hex 24)
          FLOW_ADMIN_USERNAME=admin
          FLOW_ADMIN_PASSWORD=$(openssl rand -hex 24)
          OTRYX_RPC_SHA=502117d3301d78ea76a8d02b36e62585059d9902
          FLOW_DISPATCH_E2E_PROFILE=e2e
          FLOW_NACOS_AUTH_TOKEN=$(openssl rand -base64 48)
          FLOW_NACOS_IDENTITY_VALUE=$(openssl rand -hex 24)
          FLOW_E2E_DELAY_HANDLER=true
          EOF_ENV
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build pinned Flow backend and frontend images
        run: timeout 12m docker compose build
      - name: Start Nacos and Flow services in dependency order
        run: bash scripts/start_dev_compose.sh
      - name: Verify real Worker cancellation, Retry and Cron lifecycle
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          FLOW_E2E_M2_JOBS=1 \
          FLOW_E2E_M2_SCHEDULES=1 \
          FLOW_E2E_RESTART_METADATA=1 \
            bash scripts/test_m1_e2e.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify real browser interactions against Compose
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          docker compose --profile worker-demo up -d flow-worker-demo
          cd flow-web
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.real.config.ts
      - name: Collect bounded diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=1200 mysql nacos nacos-bootstrap flow-api flow-metadata flow-scheduler flow-scheduler-replica flow-engine flow-dispatcher flow-dispatcher-replica flow-worker-demo flow-web || true
      - name: Remove ephemeral containers and database volumes
        if: always()
        run: docker compose down --volumes --remove-orphans || true
