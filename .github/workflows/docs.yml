name: Docs quality
on:
  pull_request:
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Markdown documents and requirement traceability
        run: python3 scripts/check_docs.py
