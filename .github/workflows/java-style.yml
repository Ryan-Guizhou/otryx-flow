name: Java style contract

on:
  pull_request:
    paths:
      - "**/*.java"
      - ".editorconfig"
      - ".gitattributes"
      - "scripts/check_java_style.py"
      - "scripts/test_check_java_style.py"
      - "docs/engineering/java-coding-standard.md"
      - ".github/workflows/java-style.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test style audit rules
        run: python3 scripts/test_check_java_style.py
      - name: Audit existing Java style debt
        run: python3 scripts/check_java_style.py --audit --report target/java-style-audit.json
      - name: Enforce style on changed Java files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_java_style.py --changed --base "$BASE_SHA"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-style-audit
          path: target/java-style-audit.json
          if-no-files-found: warn
