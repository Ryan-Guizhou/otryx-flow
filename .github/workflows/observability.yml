name: Observability configuration
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/observability.yml"
      - "compose.yaml"
      - "compose.observability.yaml"
      - "deploy/observability/**"
      - "flow-api/pom.xml"
      - "flow-api/src/main/resources/application.yml"
      - "flow-metadata/pom.xml"
      - "flow-metadata/src/main/resources/application.yml"
      - "flow-scheduler/pom.xml"
      - "flow-scheduler/src/main/resources/application.yml"
      - "flow-engine/pom.xml"
      - "flow-engine/src/main/resources/application.yml"
      - "flow-dispatcher/pom.xml"
      - "flow-dispatcher/src/main/resources/application.yml"
permissions:
  contents: read
concurrency:
  group: observability-config-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-observability:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<EOF_ENV
          FLOW_DB_ROOT_PASSWORD=$(openssl rand -hex 24)
          FLOW_DB_PASSWORD=$(openssl rand -hex 24)
          FLOW_ADMIN_USERNAME=admin
          FLOW_ADMIN_PASSWORD=$(openssl rand -hex 24)
          OTRYX_RPC_SHA=706b6506e49e1ade70de9c6c64c844fdd4631e17
          FLOW_DISPATCH_E2E_PROFILE=e2e
          FLOW_NACOS_AUTH_TOKEN=$(openssl rand -base64 48)
          FLOW_NACOS_IDENTITY_VALUE=$(openssl rand -hex 24)
          FLOW_GRAFANA_ADMIN_USER=admin
          FLOW_GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)
          EOF_ENV
      - name: Validate merged Compose configuration
        run: docker compose -f compose.yaml -f compose.observability.yaml config --quiet
      - name: Validate Prometheus configuration and alert rules
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.observability.yaml run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose -f compose.yaml -f compose.observability.yaml run --rm --no-deps --entrypoint promtool prometheus check rules /etc/prometheus/flow-alerts.yml
      - name: Validate OpenTelemetry Collector configuration
        run: docker compose -f compose.yaml -f compose.observability.yaml run --rm --no-deps otel-collector validate --config=/etc/otelcol-contrib/config.yaml
      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool deploy/observability/grafana/dashboards/otryx-flow-overview.json >/dev/null
